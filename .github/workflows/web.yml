# Builds the web version of Kashiro and publishes it to GitHub Pages.
# Runs only when a release is published, or by hand (Actions › Deploy web version › Run workflow).
# Pushes to branches never deploy.
# GitHub's own actions (actions/*) use major-version tags; pin any third-party action to a commit SHA.
name: Deploy web version

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: every job reads the code; only the deploy job may publish to Pages and prove its identity.
# No other secrets. (A security audit, 2026-10-31, noted the build job didn't need the publishing rights.)
permissions:
  contents: read

# One deploy at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the site's Pages settings.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The licence-notices test reads the Rust crates offline (cargo metadata --offline); a fresh runner has none yet.
      - run: cargo fetch --locked
        working-directory: src-tauri
      # The session-snapshot test reads trust/corpus/, which is generated (gitignored), not committed.
      - run: python3 trust/make_corpus.py
      - run: npm test
      - run: npx tsx scripts/build-web.ts
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
