# Builds the web version of Kashiro and publishes it to GitHub Pages.
# Runs only when a release is published, or by hand (Actions › Deploy web version › Run workflow).
# Pushes to branches never deploy.
# GitHub's own actions (actions/*) use major-version tags; pin any third-party action to a commit SHA.
name: Deploy web version

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: read the code, publish to Pages, and prove the deploy's identity. No other secrets.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsx scripts/build-web.ts
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
