# cargo-deny licence check for `npm run deps:status` (Task S8). The allow list must match
# scripts/deps/licences.ts for crates (tests/deps/licences.test.ts checks it). Anything else fails,
# non-commercial licences included.

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "CC-BY-3.0",
  "CC-BY-4.0",
  "OFL-1.1",
  "MPL-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
