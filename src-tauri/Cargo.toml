[package]
name = "writing-check"
version = "1.0.0"
description = "Free offline proofreader"
authors = ["Sujit Kumar Maiti"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "writing_check_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hashes model files (Task 12); already in Cargo.lock through Tauri.
sha2 = "=0.10.9"
# "Is this the open document?" by file identity (volume and file index), so `\\localhost\C$\…` and hard links
# count too; already in Cargo.lock through walkdir. Unlicense/MIT.
same-file = "=1.0.6"

[dev-dependencies]
# Tauri's mock runtime, to call the commands in tests; the feature adds no crate.
tauri = { version = "2", features = ["test"] }

# Hashing a 2.5 GB model in a debug build would take about a minute unoptimised.
[profile.dev.package.sha2]
opt-level = 3


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
